    <script>
      // Suppress Vite HMR WebSocket transport errors in preview environments without WebSocket proxying
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('@vite/client') ||
          event.message.includes('createWebSocketModuleRunnerTransport')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && typeof reason.message === 'string') ? reason.message : (typeof reason === 'string' ? reason : '');
        if (msg && (
          msg.includes('WebSocket') ||
          msg.includes('@vite/client') ||
          msg.includes('createWebSocketModuleRunnerTransport')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
