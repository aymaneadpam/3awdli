[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy /api/* requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Single Page Application (SPA) fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
